{{#if progress}}
    {{>prog value=progress.value}}
{{/if}}

<div id="question-box" class="instructions-stim-container">
    <div id="quest-id" data-value="{{ quest_id }}"></div>
    <div id="questionnaire">
        <div class="row gap-2">
            <h3 class="bolded-blue" data-i18n="{{ title }}"></h3>
        </div>
    {{#if img_prompt}}
        <h4 data-i18n="{{ img_prompt.text_before }}"></h4>
        <div id="img_prompt" class="pb-4">
            <img src="{{img_prompt.url}}" style="width: 100%; height: auto;">
        </div>
        <h4 data-i18n="{{ img_prompt.text_after }}"></h4>
    {{/if}}

    {{#each questions}}
        <div class="row mt-4">
            <h6 id="question-{{ this.id }}" data-type="question" class="bolded-blue"
                data-i18n="{{ this.text }}"></h6>
            <div class="col justify-content-center litw-button-group-container">
                <div class="btn-group me-2 litw-button-group" role="group" aria-label="First group">
    {{#each ../responses}}
                    <button type="button" data-qid="{{ ../this.id }}" data-rid="{{ this.id }}"
                            class="btn btn-outline-primary" data-i18n="{{ this.text }}"
                            onclick="respondQuestion({{ ../this.id }}, {{ this.id }})"></button>
    {{/each}}
                </div>
            </div>
        </div>
    {{/each}}
        <div id="submit" class="row mt-4 invisible">
            <button id="button-save" type="button" class="btn btn-primary" data-bs-toggle="button"
                    data-i18n="{{ done_button }}" onclick="finishQuestions()"></button>
        </div>
    </div>
</div>

<script type="text/javascript">
    // The answers ARE the slide's produced data, written as they are given —
    // one model, and the same object the engine submits. (`responses`, the
    // answer scale, comes from `input` and is a different thing entirely.)
    TOTAL_Q = document.querySelectorAll('[data-type="question"]').length;
    produced = LITW.slide.data.produced;

    function respondQuestion (qID, rID) {
        selectResponse(qID, rID);
        produced[qID] = rID;
        if(Object.keys(produced).length === TOTAL_Q) {
            document.getElementById('submit').classList.remove('invisible');
        }
    }

    function selectResponse (qID, rID) {
        document.querySelectorAll(`[data-qid='${qID}']`).forEach(btn => {
            if(btn.dataset.rid == rID && !btn.classList.contains('active')) {
                btn.classList.add('active');
            }
            if(btn.dataset.rid != rID && btn.classList.contains('active')) {
                btn.classList.remove('active');
            }
        })
    }

    function finishQuestions () {
        // Nothing to copy — the answers are already there. The engine wraps
        // them in the slide's name (quest1/quest2) and submits on the way out.
        document.getElementById('btn-next-page').click();
    }

</script>
