<!DOCTYPE html>
<html>
<head>
    <!-- Preview mode: the builder drives a single slide, so the study must
         NOT boot and analytics must not report an authoring session. -->
    <script>
      const litwParams = new URLSearchParams(location.search);
      // ?preview (builder host, or standalone with a slide picker)
      // ?slide=<name> implies it, so a developer can jump straight to one slide.
      window.LITW_PREVIEW = litwParams.has('preview') || litwParams.has('slide');
    </script>

    <!-- Google tag (gtag.js) -->
    <script>
      if (!window.LITW_PREVIEW) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){ window.dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', 'G-PGNFSBWM40');
        const gtagScript = document.createElement('script');
        gtagScript.async = true;
        gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-PGNFSBWM40';
        document.head.appendChild(gtagScript);
      }
    </script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title data-i18n='litw-template-title'></title>

    <!-- open graph tags -->
    <meta property="og:site_name" content="LabintheWild"/>
    <meta property="og:title" content="My LabintheWild Study"/>
    <meta property="og:url" content="https://tutorial.labinthewild.org/"/>
    <meta property="og:image" content=""/>
    <meta property="og:description" content="This is the start of my own LabintheWild Study!!!"/>

    <!-- ***** stylesheets ***** -->
    <link href="/css/bootstrap.min-5_3_0.css" rel="stylesheet" type="text/css">
    <link href="/css/bootstrap-icons-1.11.3.css" rel="stylesheet" type="text/css">
    <link href="/css/shareon.min-2.7.0.css" rel="stylesheet" type="text/css">
    <link href="/css/litw-styles-2.0.0.css" rel="stylesheet" type="text/css">

</head>

<body class="container-lg">
<div id="content">
    <div id="header">
        <a href='https://www.labinthewild.org'>
            <img src='/img/LITW-logo2020.png' id='logo'
                 alt='The Lab in the Wild logo showing an Earth globe and the name of the site in green colors.'/>
        </a>
        <div id='header-share' class='sharing-buttons'></div>
        <div class='separator'>&nbsp;</div>
    </div>
    <!-- Slides are NOT listed here: the engine creates an element named after
         each slide it shows. Only the page's own chrome lives in this file. -->
    <div id="btn-next-page"></div>
    <div id="ajax-working"></div>
</div>

<!-- Dependencies: plain scripts (loaded as globals). Bootstrap's bundle is
     kept for the results page's accordions and the likert control; jQuery and
     Alpaca are gone — the engine and the templates are plain DOM + fetch. -->
<script src="/vendor/bootstrap.bundle.5.3.0.min.js"></script>
<script src="/vendor/handlebars.js"></script>

<!-- LITW modules: study-manager boots the study; with ?preview the builder
     drives a single slide through the engine's preview host instead. -->
<script type="module">
  if (window.LITW_PREVIEW) {
    import('/engine/litw.preview.mjs');
  } else {
    import('./study-manager.mjs');
  }
</script>

</body>
</html>
